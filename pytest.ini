[pytest]
# Der Projektordner enthaelt einen Symlink auf ein anderes Projekt
# (km-hr-agent -> /opt/km-hr-agent). Ohne diesen Ausschluss sammelt pytest
# dessen conftest.py mit und bricht mit "pytest_plugins in non-top-level
# conftest" ab. .venv* und generierte Arbeitsordner gehoeren ebenfalls nicht
# in die Sammlung.
norecursedirs = .* .venv* km-hr-agent rome-2star work node_modules
